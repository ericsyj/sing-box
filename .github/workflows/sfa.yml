name: Build SFA

on:
  workflow_dispatch:

jobs:
  sing-box:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.sing-box.outputs.version}}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: get sing-box version
        id: sing-box
        run: |
          git remote add sekai https://github.com/SagerNet/sing-box.git
          git fetch --tags sekai
          version=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag)
          echo version=$version >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: sing-box
    env:
      VERSION: ${{ needs.sing-box.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: checkout app repository
        uses: actions/checkout@v6
        with:
          path: sfa
          repository: SagerNet/sing-box-for-android
          ref: dev
          submodules: recursive

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: setup ndk
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: get latest build tools version
        id: sdk
        run: echo version=$(ls $ANDROID_HOME/build-tools | tail -n 1) >> $GITHUB_OUTPUT

      - name: build libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale,with_naive_outbound,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird
          CGO_ENABLED: '0'
        run: |
          make lib_install
          gomobile bind -v -a -trimpath -buildvcs=false -androidapi 23 -javapkg=io.nekohasekai -libname=box -tags ${TAGS} -ldflags "-checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${VERSION} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1 -s -w -buildid=" ./experimental/libbox

      - name: setup build env && build app
        env:
          KEYSTORE: ${{secrets.SIGN_KEY}}
          ALIAS_NAME: ${{secrets.ALIAS}}
          KEYSTORE_PASS: ${{secrets.SIGN_KEY}}
        run: |
          mkdir -p sfa/app/libs/
          cp ./libbox.aar sfa/app/libs/
          cd sfa
          echo "VERSION_NAME=${VERSION}" > local.properties
          echo "VERSION_CODE=$(date +%Y%m%d%H)" >> local.properties
          sed -i '/signingConfigs\.getByName/d' app/build.gradle.kts
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherRelease --debug

      - name: sign app
        uses: PuerNya/sign-android-release@v2.0.4
        env:
          BUILD_TOOLS_VERSION: ${{steps.sdk.outputs.version}}
        with:
          alias: ${{secrets.ALIAS}}
          releaseDirectory: sfa/app/build/outputs/apk/other/release
          signingKeyBase64: ${{secrets.SIGN_KEY}}
          keyStorePassword: ${{secrets.KEY_STORE_PASSWORD}}

      - name: upload arm64-v8a apk
        uses: actions/upload-artifact@v7
        with:
          name: sfa-${{env.VERSION}}-arm64-v8a
          path: sfa/app/build/outputs/apk/other/release/*-arm64-v8a-signed.apk
          compression-level: 9

      - name: upload armeabi-v7a apk
        uses: actions/upload-artifact@v7
        with:
          name: sfa-${{env.VERSION}}-armeabi-v7a
          path: sfa/app/build/outputs/apk/other/release/*-armeabi-v7a-signed.apk
          compression-level: 9

      - name: upload x86_64 apk
        uses: actions/upload-artifact@v7
        with:
          name: sfa-${{env.VERSION}}-x86_64
          path: sfa/app/build/outputs/apk/other/release/*-x86_64-signed.apk
          compression-level: 9

      - name: upload x86 apk
        uses: actions/upload-artifact@v7
        with:
          name: sfa-${{env.VERSION}}-x86
          path: sfa/app/build/outputs/apk/other/release/*-x86-signed.apk
          compression-level: 9

      - name: upload universal apk
        uses: actions/upload-artifact@v7
        with:
          name: sfa-${{env.VERSION}}-universal
          path: sfa/app/build/outputs/apk/other/release/*-universal-signed.apk
          compression-level: 9